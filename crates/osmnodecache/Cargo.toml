[package]
name = "osmnodecache"
version = "0.10.2"
description = "OSM node ID to location stores for importing and updating OpenStreetMap data, from a city to the planet"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["osm", "cache"]
categories = ["caching", "science::geo"]
rust-version = "1.90"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "pbf_eval"
required-features = ["paged"]

# Lookups and commits of every store: `just bench`
[[bench]]
name = "bench"
harness = false
required-features = ["paged", "redb", "dense", "memory"]

[features]
default = ["paged"]
# PagedStore: compressed pages in one memory-mapped file; the smallest and fastest store for large data
paged = ["dep:crc32fast", "dep:rayon"]
# RedbStore: compressed groups of nodes in a redb database; commits that survive a power loss
redb = ["dep:redb", "dep:rayon"]
# DenseStore: 8 bytes per node ID in one memory-mapped file; the fastest with RAM for the whole file
dense = ["dep:crc32fast"]
# MemoryStore: a hash map in memory, with no file; for small extracts
memory = []

[dependencies]
crc32fast = { workspace = true, optional = true }
memmap2.workspace = true
rayon = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
criterion.workspace = true
flate2 = { workspace = true, features = ["zlib-ng"] }
libc.workspace = true
osmpbf.workspace = true # Used in a doc test and examples
rand.workspace = true
rayon.workspace = true
zlib-rs.workspace = true

[lints]
workspace = true
