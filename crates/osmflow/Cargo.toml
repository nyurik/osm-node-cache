[package]
name = "osmflow"
version = "0.13.0"
description = "Fast, parallel reading of OpenStreetMap PBF files, and node location stores, from a city extract to the planet"
authors.workspace = true
# The crate's own directory, ending in `/`: Dependabot then shows this crate's CHANGELOG.md in its PRs
repository = "https://github.com/nyurik/osmflow/tree/main/crates/osmflow/"
edition.workspace = true
license.workspace = true
keywords = ["osm", "openstreetmap", "pbf", "parser", "cache"]
categories = ["parser-implementations", "science::geo", "caching"]
rust-version.workspace = true
exclude = ["/fixtures"]

[package.metadata.docs.rs]
all-features = true

# Parsing an osmChange file: `cargo bench -p osmflow --bench osc`
[[bench]]
name = "osc"
harness = false
required-features = ["osc"]

# Lookups and commits of every node store: `just bench`
[[bench]]
name = "nodes"
harness = false
required-features = ["nodes"]

[features]
default = ["geometry", "osc"]
# Ways as geo-types geometries, their node locations from a node store: the reader and the stores together
geometry = ["dep:geo-types", "nodes", "pbf"]
# The node location stores, in `osmflow::nodes`
nodes = ["dep:crc32fast", "dep:memmap2", "dep:rayon"]
# The PBF reader
pbf = ["dep:buffa", "dep:flate2", "dep:rayon", "dep:rustix", "dep:tracing"]
# Reading osmChange files and replication diffs
osc = ["dep:flate2", "dep:memchr", "dep:tracing"]
# Downloading replication diffs and state files over HTTP
http = ["dep:ureq", "osc"]

[dependencies]
buffa = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true, features = ["zlib-rs", "runtime_detection"] }
geo-types = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
# For the `codegen` example, which regenerates src/generated (`just update-generated`, needs protoc)
buffa-build.workspace = true
criterion.workspace = true
insta.workspace = true
# The pure Rust backend: flate2 then decodes with osmflow's zlib-rs in the tests, as for osmflow's users
osmpbf = { workspace = true, features = ["rust-zlib"] }
osmpbfreader.workspace = true
rand.workspace = true
test_each_file.workspace = true

[lints]
workspace = true

[[test]]
name = "fixtures"
required-features = ["pbf"]

[[test]]
name = "generated"
required-features = ["pbf"]

[[test]]
name = "keys"
required-features = ["pbf"]

[[test]]
name = "layout"
required-features = ["pbf"]

[[test]]
name = "pools"
required-features = ["pbf"]

[[test]]
name = "geometry"
required-features = ["geometry"]

[[test]]
name = "osc"
required-features = ["osc", "pbf"]

[[test]]
name = "replication"
required-features = ["osc"]
