[package]
name = "osmflow"
version = "0.0.0"
description = "Fast, parallel reading of OpenStreetMap PBF files, from a city extract to the planet"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["osm", "openstreetmap", "pbf", "parser"]
categories = ["parser-implementations", "science::geo"]
rust-version = "1.90"
publish = false

[[bench]]
name = "parse"
harness = false

[dependencies]
# pin buffa to the same v as dev-dependencies.
# When updating, make sure to run `just update-generated` - stored generated code must match. This avoids having protoc for the users.
buffa = "=0.9.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
rayon = "1"
thiserror = "2"

[dev-dependencies]
# For the `codegen` example, which regenerates src/generated (`just update-generated`, needs protoc); the same version
# as buffa, since the generated code must match its runtime.
buffa-build = "=0.9.2"
criterion = "0.8"
insta = "1.43"
osmpbf = { version = "0.3.8", default-features = false, features = ["zlib-ng"] }
osmpbfreader = "0.19"
test_each_file = "0.3.5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The benchmark evicts its input from the page cache before each run, and checks that it is gone
libc = "0.2"

[lints]
workspace = true
