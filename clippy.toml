allow-mixed-uninlined-format-args = false
allow-panic-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false

disallowed-methods = [
    "alloc::boxed::Box::leak",
    "alloc::vec::Vec::leak",
    "std::boxed::Box::leak",
    "std::vec::Vec::leak",
]

# Words in docs that are not code, so they need no backticks
doc-valid-idents = ["NVMe", "GeoJSON", "FeatureCollection", "PostGIS", ".."]

# Two versions each: base64, getrandom and wasi through `postgres` and through `ureq`, which neither crate lets us
# unify; syn 2 through strum's derives, and syn 3 through thiserror's and clap's; thiserror 1 and hashbrown 0.17
# through `wkb` and its num_enum derive
allowed-duplicate-crates = ["base64", "getrandom", "hashbrown", "syn", "thiserror", "thiserror-impl", "wasi"]
