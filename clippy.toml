allow-mixed-uninlined-format-args = false
allow-panic-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false

disallowed-methods = [
    "alloc::boxed::Box::leak",
    "alloc::vec::Vec::leak",
    "std::boxed::Box::leak",
    "std::vec::Vec::leak",
]

# Words in docs that are not code, so they need no backticks
doc-valid-idents = ["NVMe", "GeoJSON", "FeatureCollection", ".."]
