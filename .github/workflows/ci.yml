name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'Attach the osmflow binaries to this existing release, e.g. osmflow-cli-v0.11.0; empty for none'
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall,protoc' }
      - run: just ci-test

  # The full checks run on Linux above; this runs the tests where files, locks and memory maps behave differently
  test-os:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --all-targets
      - run: cargo test --workspace --all-features --doc

  test-msrv:
    name: Test MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall,cargo-minimal-versions,cargo-hack' }
      - name: Read MSRV
        id: msrv
        run: echo "value=$(just get-msrv)" >> $GITHUB_OUTPUT
      - name: Install nightly Rust for minimal dependency resolution
        uses: dtolnay/rust-toolchain@stable
        with: { toolchain: nightly }
      - name: Install MSRV Rust ${{ steps.msrv.outputs.value }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      - run: just ci-test-msrv

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }
      - run: just ci-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # Build the release binaries on pull requests without uploading them, so a target that stops building shows up before
  # a release. The same matrix uploads them in `release-binaries` below.
  build-binaries:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: &binary-targets
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - if: contains(matrix.target, '-linux-')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with: { target: '${{ matrix.target }}' }
      - if: endsWith(matrix.target, 'windows-msvc')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: osmflow
          package: osmflow-cli
          target: '${{ matrix.target }}'
          tar: unix
          zip: windows
          include: LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          locked: true
          dry-run: true

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    needs: [ test, test-os, test-msrv, build-binaries ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ ci-passed ]
    if: |
      always()
      && needs.ci-passed.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'nyurik'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      cli_tag: ${{ steps.cli.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@v0.5
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: Find the tag of the osmflow-cli release, if it was released
        id: cli
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(jq -r '.[] | select(.package_name == "osmflow-cli") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@v0.5
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Attach the osmflow binaries to the GitHub release of osmflow-cli, named as the binstall metadata in
  # crates/osmflow-cli/Cargo.toml expects: osmflow-<target>.tar.gz, or .zip on Windows. It runs once release-plz has
  # released osmflow-cli, or when the workflow is run by hand with the tag of an existing release (cli_tag).
  # always(): without it, the job is skipped whenever any job above it is, and build-binaries, which ci-passed needs,
  # is skipped on every push.
  release-binaries:
    name: Release ${{ matrix.target }}
    needs: [ release-plz ]
    if: |
      always()
      && (
        (needs.release-plz.result == 'success' && needs.release-plz.outputs.cli_tag != '')
        || (github.event_name == 'workflow_dispatch' && startsWith(inputs.cli_tag, 'osmflow-cli-v'))
      )
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: *binary-targets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.cli_tag || inputs.cli_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: contains(matrix.target, '-linux-')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with: { target: '${{ matrix.target }}' }
      - if: endsWith(matrix.target, 'windows-msvc')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: osmflow
          package: osmflow-cli
          target: '${{ matrix.target }}'
          ref: refs/tags/${{ needs.release-plz.outputs.cli_tag || inputs.cli_tag }}
          tar: unix
          zip: windows
          include: LICENSE-MIT,LICENSE-APACHE
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
