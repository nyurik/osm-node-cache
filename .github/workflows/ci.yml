name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'Attach the osmflow binaries to this existing release, e.g. osmflow-cli-v0.11.0; empty for none'
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # For osmflow-sync's database test
    services:
      postgis:
        image: postgis/postgis:18-3.6-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: [ '5432:5432' ]
        options: --health-cmd "pg_isready -h localhost -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      OSMFLOW_SYNC_TEST_DB: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name != 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall,protoc' }
      - run: just ci-test

  # The full checks run on Linux above; this runs the tests where files, locks and memory maps behave differently
  test-os:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just env-info test

  test-msrv:
    name: Test MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall,cargo-minimal-versions,cargo-hack' }
      - name: Read MSRV
        id: msrv
        run: echo "value=$(just get-msrv)" >> $GITHUB_OUTPUT
      - name: Install nightly Rust for minimal dependency resolution
        uses: dtolnay/rust-toolchain@stable
        with: { toolchain: nightly }
      - name: Install MSRV Rust ${{ steps.msrv.outputs.value }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      - run: just ci-test-msrv

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-llvm-cov' }
      - run: just ci-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov/lcov.info

  # Build the release binaries on every run, kept as its artifacts, which release-plz attaches to an osmflow-cli release.
  # Run by hand with cli_tag, it builds that tag.
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cli_tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: contains(matrix.target, '-linux-')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with: { target: '${{ matrix.target }}' }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just dist '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: osmflow-${{ matrix.target }}
          path: target/dist/osmflow-${{ matrix.target }}.*
          if-no-files-found: error

  cpd:
    name: Copy/Paste Detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch base branch to detect newly added clones
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-binstall' }
      - run: just ci-cpd "origin/$BASE_REF"
        env:
          CPD_BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}
      # Pull requests from forks get a read-only token, so they only get the job summary
      - if: github.event.pull_request.head.repo.full_name == github.repository
        name: Post summary as a PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: jscpd
          path: target/jscpd/summary.md
          skip_unchanged: true

  # This job checks if any of the previous jobs failed or were canceled.
  # This approach also allows some jobs to be skipped if they are not needed.
  ci-passed:
    needs: [ test, test-os, test-msrv, build-binaries ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result of the needed steps
        run: echo "${{ toJSON(needs) }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Release unpublished packages or create a PR with changes
  release-plz:
    needs: [ ci-passed ]
    if: |
      always()
      && needs.ci-passed.result == 'success'
      && github.repository_owner == 'nyurik'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_dispatch' && startsWith(inputs.cli_tag, 'osmflow-cli-v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - if: github.event_name == 'push'
        name: Publish to crates.io if crate's version is newer
        uses: release-plz/action@v0.5
        id: release
        with: { command: release }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        name: Find the tag of the osmflow-cli release, if it was released
        id: cli
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(jq -r '.[] | select(.package_name == "osmflow-cli") | .tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.release.outputs.releases_created == 'false' }}
        name: If version is the same, create a PR proposing new version and changelog for the next release
        uses: release-plz/action@v0.5
        with: { command: release-pr }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Attach this run's binaries to the osmflow-cli release just made, or to cli_tag's; the release's notes are kept
      - if: steps.cli.outputs.tag || inputs.cli_tag
        uses: actions/download-artifact@v8
        with: { pattern: osmflow-*, merge-multiple: true, path: target/dist }
      - if: steps.cli.outputs.tag || inputs.cli_tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.cli.outputs.tag || inputs.cli_tag }}
          files: target/dist/*
          fail_on_unmatched_files: true
