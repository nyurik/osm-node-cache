version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: weekly }
    groups:
      all-actions-version-updates:
        applies-to: version-updates
        patterns: [ '*' ]
      all-actions-security-updates:
        applies-to: security-updates
        patterns: [ '*' ]

  # Update Rust dependencies
  - package-ecosystem: cargo
    directory: '/'
    schedule: { interval: daily, time: '02:00' }
    open-pull-requests-limit: 10
    ignore:
      # osmflow's checked-in generated code must match buffa's runtime: `just update-generated` moves them together
      - dependency-name: buffa
      - dependency-name: buffa-build
    groups:
      all-cargo-version-updates:
        applies-to: version-updates
        patterns: [ '*' ]
      all-cargo-security-updates:
        applies-to: security-updates
        patterns: [ '*' ]
