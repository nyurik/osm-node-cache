[package]
name = "osmnodecache"
version = "0.10.2"
description = "OSM node ID to location stores for importing and updating OpenStreetMap data, from a city to the planet"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
repository = "https://github.com/nyurik/osm-node-cache"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["osm", "cache"]
categories = ["caching", "science::geo"]
rust-version = "1.90"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "pbf_eval"
required-features = ["paged"]

[features]
default = ["paged"]
# PagedStore: compressed pages in one memory-mapped file; the smallest and fastest store for large data
paged = ["dep:crc32fast", "dep:rayon"]
# RedbStore: compressed groups of nodes in a redb database; commits that survive a power loss
redb = ["dep:redb", "dep:rayon"]
# DenseStore: 8 bytes per node ID in one memory-mapped file; the fastest with RAM for the whole file
dense = ["dep:crc32fast"]
# MemoryStore: a hash map in memory, with no file; for small extracts
memory = []

[dependencies]
crc32fast = { version = "1", optional = true }
memmap2 = "0.9"
rayon = { version = "1", optional = true }
redb = { version = "4", optional = true }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-ng"] }
libc = "0.2"
osmpbf = { version = "0.3", default-features = false, features = ["zlib-ng"] } # Used in a doc test and examples
rand = "0.10"
rayon = "1"
zlib-rs = "0.6"

[lints]
workspace = true

[workspace]
resolver = "2"
# Use `just bench` or `cargo bench -p bench` to run the benchmarks.
members = [".", "bench"]
default-members = ["."]

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
# Restrictions
disallowed_methods = "forbid"
panic_in_result_fn = "warn"
# TODO: todo = "warn"
# TODO: unwrap_used = "warn"
# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
