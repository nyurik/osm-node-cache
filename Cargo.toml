[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
repository = "https://github.com/nyurik/osm-node-cache"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
# osmflow's checked-in generated code must match buffa's runtime, so both are pinned to one version; after changing it,
# run `just update-generated`, which regenerates the code (and needs protoc, which users of osmflow then do not)
buffa = "=0.9.2"
buffa-build = "=0.9.2"
crc32fast = "1.3"
criterion = "0.8"
flate2 = { version = "1.1.10", default-features = false }
insta = "1.43"
libc = "0.2"
memmap2 = "0.9"
osmpbf = { version = "0.3.8", default-features = false, features = ["zlib-ng"] }
osmpbfreader = "0.19"
rand = "0.10"
# 1.5.1 is the first with `ThreadPool::in_place_scope`
rayon = "1.5.1"
redb = "4"
test_each_file = "0.3.5"
thiserror = "2"
zlib-rs = "0.6"

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
# Restrictions
disallowed_methods = "forbid"
as_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
negative_feature_names = "warn"
panic = "warn"
panic_in_result_fn = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
str_to_string = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unused_trait_names = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[patch.crates-io]
# buffa with `packed_views_in` (https://github.com/anthropics/buffa/pull/816), which osmflow's projection uses to read
# dense node arrays as borrowed `PackedView`s
buffa = { git = "https://github.com/nyurik/buffa", branch = "packed-views" }
buffa-build = { git = "https://github.com/nyurik/buffa", branch = "packed-views" }
