[package]
name = "osmnodecache"
version = "0.10.2"
description = "OSM node location caches: a compact memory-mapped paged file, a redb store, and a flat file"
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
repository = "https://github.com/nyurik/osm-node-cache"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["osm", "cache"]
categories = ["caching", "science::geo"]
rust-version = "1.90"

[features]
default = ["native"]
# PagedFileCache, the fastest store, in one memory-mapped file
native = []
# KvNodeStore in redb, a B-tree database: slower lookups, commits that survive a power loss
redb = ["dep:redb"]

[dependencies]
bincode-next = { version = "3", features = ["serde", "alloc"] }
dashmap = { version = "6", features = ["serde"] }
memmap2 = "0.9"
redb = { version = "4", optional = true }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
osmpbf = { version = "0.3", default-features = false, features = ["zlib-ng"] } # Used in a doc test and examples
rand = "0.10"
rayon = "1"

[[example]]
name = "pbf_eval"
required-features = ["native"]

[lints]
workspace = true

[workspace]
resolver = "2"
# Use `just bench` or `cargo bench -p bench` to run the benchmarks.
members = [".", "bench"]
default-members = ["."]

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
# Restrictions
disallowed_methods = "forbid"
panic_in_result_fn = "warn"
# TODO: todo = "warn"
# TODO: unwrap_used = "warn"
# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
