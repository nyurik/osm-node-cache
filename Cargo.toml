[workspace]
resolver = "2"
members = [
    "benches/common",
    "benches/nodes",
    "benches/osmflow",
    "benches/osmpbf",
    "benches/osmpbfreader",
    "crates/*",
]

[workspace.package]
authors = ["Yuri Astrakhan <YuriAstrakhan@gmail.com>"]
repository = "https://github.com/nyurik/osmflow"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
# osmflow's checked-in generated code must match buffa's runtime, so both are pinned to one version
# after changing it, run `just update-generated`, which regenerates the code.
# Update requires protoc, which users of osmflow then do not as generated code is checked in.
buffa = "=0.9.2"
buffa-build = "=0.9.2"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crc32fast = "1.3"
criterion = "0.8"
flate2 = { version = "1.1.10", default-features = false }
geo-types = { version = "0.7.9", default-features = false, features = ["std"] }
insta = "1.43"
# 0.2.171 is the oldest that rustix 1.1, which osmflow uses, accepts
libc = "0.2.171"
memchr = "2.7"
memmap2 = "0.9"
osm-bench = { path = "benches/common" }
osmflow = { path = "crates/osmflow", version = "0.11.0" }
osmpbf = { version = "0.3.8", default-features = false, features = ["zlib-ng"] }
osmpbfreader = "0.19"
rand = "0.10"
# 1.7 is the first with `ThreadPool::yield_now`
rayon = "1.7"
# On Linux, for the PBF reader: `fadvise` to keep a large file from crowding the page cache, `sysinfo` for the memory
rustix = { version = "1.1", default-features = false, features = ["fs", "std", "system"] }
tempfile = "3.20"
test_each_file = "0.3.5"
thiserror = "2"
# Without its `attributes` feature, so no proc macros: spans are made with the macros
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry", "std", "tracing-log"] }
# Without its default `gzip` feature: diffs are downloaded as they are stored, gzipped
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
# `deny` rather than `forbid`, so the few places that need unsafe code opt in with `#[expect(unsafe_code)]`
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Restrictions
disallowed_methods = "deny"
absolute_paths = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "warn"
negative_feature_names = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
str_to_string = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unused_trait_names = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
# Pedantics without being too noisy
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
